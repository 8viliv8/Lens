<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#050505" />
<title>NOIR CAMERA</title>
<style>
:root{--bg:#050505;--text:#f4f4f4;--muted:#999;--safe-top:max(14px,env(safe-area-inset-top));--safe-bottom:max(14px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;min-height:100%}body{overscroll-behavior:none}button,input{font:inherit}
.app{min-height:100dvh;display:grid;grid-template-rows:auto minmax(300px,1fr) auto}
header{padding:var(--safe-top) 14px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #181818;background:#080808;position:relative;z-index:5}.brand{font-size:13px;letter-spacing:.18em;font-weight:700}.sub{font-size:10px;color:var(--muted);letter-spacing:.12em;margin-top:2px}.header-actions{display:flex;gap:8px}.mini{border:1px solid #333;background:#111;color:#fff;border-radius:999px;padding:8px 10px;font-size:11px}
.stage{position:relative;background:#000;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center}video,canvas{width:100%;height:100%;display:block;object-fit:cover;background:#000}video{position:absolute;inset:0;opacity:0;pointer-events:none}#view{position:absolute;inset:0}
.guide{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33.333%,rgba(255,255,255,.07) 33.333%,rgba(255,255,255,.07) 33.5%,transparent 33.5%,transparent 66.666%,rgba(255,255,255,.07) 66.666%,rgba(255,255,255,.07) 66.85%,transparent 66.85%),linear-gradient(to bottom,transparent 33.333%,rgba(255,255,255,.07) 33.333%,rgba(255,255,255,.07) 33.5%,transparent 33.5%,transparent 66.666%,rgba(255,255,255,.07) 66.666%,rgba(255,255,255,.07) 66.85%,transparent 66.85%);opacity:0}.guide.on{opacity:1}
.status{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.54);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 9px;font-size:10px;letter-spacing:.08em}.empty{text-align:center;color:#9c9c9c;max-width:290px;padding:24px;line-height:1.7;font-size:13px}.empty b{color:#fff}
.controls{background:#090909;border-top:1px solid #1c1c1c;padding:10px 12px var(--safe-bottom);max-height:46dvh;overflow:auto}.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.presets::-webkit-scrollbar{display:none}.preset{flex:0 0 auto;border:1px solid #333;background:#111;color:#ddd;border-radius:999px;padding:8px 11px;font-size:11px}.preset.active{background:#f0f0f0;color:#000;border-color:#f0f0f0;font-weight:700}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}.ctl{min-width:0}.lab{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#aaa;margin-bottom:3px}.lab output{color:#fff;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#fff}
.toolbar{margin-top:11px;display:grid;grid-template-columns:1fr 82px 1fr;align-items:center;gap:12px}.toolbtn{min-height:46px;border:1px solid #333;background:#111;color:#fff;border-radius:14px;font-size:12px}.shutter{width:74px;height:74px;border-radius:50%;background:#f3f3f3;border:6px solid #1a1a1a;box-shadow:0 0 0 2px #eee;justify-self:center}.save-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.save-row button{min-height:42px;border:1px solid #333;background:#111;color:#fff;border-radius:12px}.save-row button.primary{background:#eee;color:#000;border-color:#eee;font-weight:700}.hidden{display:none!important}
@media(min-width:760px){.app{grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto 1fr}header{grid-column:1/3}.stage{grid-column:1;grid-row:2}.controls{grid-column:2;grid-row:2;max-height:none;border-top:none;border-left:1px solid #1c1c1c;padding:14px}.sliders{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">NOIR CAMERA</div><div class="sub">HARD LIGHT / DEEP BLACK / SILVER GRAIN</div></div><div class="header-actions"><button class="mini" id="gridBtn">GRID</button><button class="mini" id="flipBtn">↺</button></div></header>
<main class="stage" id="stage"><video id="video" playsinline muted autoplay></video><canvas id="view"></canvas><div class="guide" id="guide"></div><div class="status" id="status">READY</div><div class="empty" id="empty"><b>iPhoneカメラで直接撮影できます。</b><br>LIVEを押してカメラを許可してください。</div></main>
<section class="controls">
<div class="presets"><button class="preset active" data-preset="hard">HARD SUN</button><button class="preset" data-preset="sky">SKY GRAIN</button><button class="preset" data-preset="void">DEEP VOID</button><button class="preset" data-preset="cloud">CLOUD DRAMA</button><button class="preset" data-preset="night">NIGHT BLOOM</button></div>
<div class="sliders">
<div class="ctl"><div class="lab"><span>EXPOSURE</span><output id="oExp">+0.30</output></div><input id="exposure" type="range" min="-2" max="2" step=".05" value=".30"></div>
<div class="ctl"><div class="lab"><span>CONTRAST</span><output id="oCon">1.70</output></div><input id="contrast" type="range" min=".6" max="3" step=".05" value="1.70"></div>
<div class="ctl"><div class="lab"><span>BLACK CRUSH</span><output id="oBlk">0.16</output></div><input id="black" type="range" min="0" max=".45" step=".01" value=".16"></div>
<div class="ctl"><div class="lab"><span>HIGHLIGHT CLIP</span><output id="oHi">0.87</output></div><input id="highlight" type="range" min=".55" max="1" step=".01" value=".87"></div>
<div class="ctl"><div class="lab"><span>GRAIN</span><output id="oGr">0.12</output></div><input id="grain" type="range" min="0" max=".38" step=".01" value=".12"></div>
<div class="ctl"><div class="lab"><span>GLOW</span><output id="oGl">0.10</output></div><input id="glow" type="range" min="0" max=".55" step=".01" value=".10"></div>
<div class="ctl"><div class="lab"><span>VIGNETTE</span><output id="oVi">0.13</output></div><input id="vignette" type="range" min="0" max=".65" step=".01" value=".13"></div>
<div class="ctl"><div class="lab"><span>GRAIN SIZE</span><output id="oGs">1</output></div><input id="grainSize" type="range" min="1" max="4" step="1" value="1"></div>
</div>
<div class="toolbar"><button class="toolbtn" id="cameraBtn">LIVE</button><button class="shutter" id="shutter" aria-label="撮影"></button><button class="toolbtn" id="loadBtn">ライブラリ</button></div>
<div class="save-row"><button id="resetBtn">RESET</button><button class="primary" id="saveBtn">JPEG保存</button><button id="shareBtn">共有</button></div>
<input id="file" class="hidden" type="file" accept="image/*"><input id="cameraFile" class="hidden" type="file" accept="image/*" capture="environment">
</section></div>
<script>
(()=>{
const video=document.getElementById('video'),view=document.getElementById('view'),stage=document.getElementById('stage'),empty=document.getElementById('empty'),status=document.getElementById('status'),file=document.getElementById('file'),cameraFile=document.getElementById('cameraFile'),guide=document.getElementById('guide');
const controls={exposure:document.getElementById('exposure'),contrast:document.getElementById('contrast'),black:document.getElementById('black'),highlight:document.getElementById('highlight'),grain:document.getElementById('grain'),glow:document.getElementById('glow'),vignette:document.getElementById('vignette'),grainSize:document.getElementById('grainSize')};
const outs={exposure:document.getElementById('oExp'),contrast:document.getElementById('oCon'),black:document.getElementById('oBlk'),highlight:document.getElementById('oHi'),grain:document.getElementById('oGr'),glow:document.getElementById('oGl'),vignette:document.getElementById('oVi'),grainSize:document.getElementById('oGs')};
let stream=null,facing='environment',sourceImage=null,live=false,lastFrame=0,seed=1337;
const presets={hard:{exposure:.30,contrast:1.70,black:.16,highlight:.87,grain:.12,glow:.10,vignette:.13,grainSize:1},sky:{exposure:.12,contrast:1.34,black:.07,highlight:.97,grain:.18,glow:.02,vignette:.10,grainSize:1},void:{exposure:-.60,contrast:2.10,black:.26,highlight:.83,grain:.08,glow:.08,vignette:.30,grainSize:1},cloud:{exposure:.05,contrast:1.66,black:.13,highlight:.91,grain:.16,glow:.04,vignette:.18,grainSize:1},night:{exposure:.45,contrast:1.85,black:.20,highlight:.72,grain:.14,glow:.36,vignette:.22,grainSize:2}};
function fmt(k,v){if(k==='exposure')return(v>=0?'+':'')+Number(v).toFixed(2);if(k==='grainSize')return String(Math.round(v));return Number(v).toFixed(2)}
function updateOutputs(){for(const k in controls)outs[k].textContent=fmt(k,controls[k].value)}
Object.values(controls).forEach(el=>el.addEventListener('input',()=>{updateOutputs();if(sourceImage&&!live)renderImage(sourceImage,false)}));updateOutputs();
document.querySelectorAll('.preset').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const p=presets[btn.dataset.preset];for(const k in p)controls[k].value=p[k];updateOutputs();seed=(Math.random()*1e9)|0;if(sourceImage&&!live)renderImage(sourceImage,false)}));
function params(){const p={};for(const k in controls)p[k]=Number(controls[k].value);return p}
function noise2(x,y,s){let n=(x*374761393+y*668265263+s*69069)|0;n=(n^(n>>>13))*1274126177;return(((n^(n>>>16))>>>0)/4294967295)*2-1}
function processCanvas(srcCanvas,dstCanvas){const p=params(),sctx=srcCanvas.getContext('2d',{willReadFrequently:true}),w=srcCanvas.width,h=srcCanvas.height;dstCanvas.width=w;dstCanvas.height=h;const dctx=dstCanvas.getContext('2d',{willReadFrequently:true}),img=sctx.getImageData(0,0,w,h),d=img.data,gain=Math.pow(2,p.exposure),invRange=1/Math.max(.001,p.highlight-p.black),gs=Math.max(1,Math.round(p.grainSize)),cx=w/2,cy=h/2,maxD=Math.sqrt(cx*cx+cy*cy);
for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;let Y=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;Y*=gain;Y=.5+(Y-.5)*p.contrast;Y=(Y-p.black)*invRange;if(Y<0)Y=0;else if(Y>1)Y=1;Y=Math.pow(Y,.92);const bx=Math.floor(x/gs),by=Math.floor(y/gs),n=noise2(bx,by,seed),mid=.28+.72*(1-Math.abs(2*Y-1));Y+=n*p.grain*mid;const dx=(x-cx)/maxD,dy=(y-cy)/maxD,r2=dx*dx+dy*dy;Y*=Math.max(0,1-p.vignette*Math.pow(r2*1.7,1.35));Y=Math.max(0,Math.min(1,Y));const v=(Y*255)|0;d[i]=d[i+1]=d[i+2]=v}dctx.putImageData(img,0,0);
if(p.glow>.001){const glow=document.createElement('canvas');glow.width=w;glow.height=h;const g=glow.getContext('2d');g.filter=`blur(${Math.max(2,Math.round(Math.min(w,h)*.012))}px) brightness(${1.4+p.glow*2})`;g.drawImage(dstCanvas,0,0);g.filter='none';dctx.globalCompositeOperation='screen';dctx.globalAlpha=Math.min(.62,p.glow);dctx.drawImage(glow,0,0);dctx.globalAlpha=1;dctx.globalCompositeOperation='source-over'}}
function fitCanvas(w,h,maxSide){const scale=Math.min(1,maxSide/Math.max(w,h));return[Math.max(1,Math.round(w*scale)),Math.max(1,Math.round(h*scale))]}
function renderImage(img,full=false){empty.style.display='none';const nw=img.videoWidth||img.naturalWidth||img.width,nh=img.videoHeight||img.naturalHeight||img.height;if(!nw||!nh)return;const maxSide=full?3200:(window.innerWidth<760?900:1200),[w,h]=fitCanvas(nw,nh,maxSide),src=document.createElement('canvas');src.width=w;src.height=h;src.getContext('2d').drawImage(img,0,0,w,h);processCanvas(src,view)}
function loop(ts){if(!live)return;requestAnimationFrame(loop);if(ts-lastFrame<70)return;lastFrame=ts;if(video.readyState>=2)renderImage(video,false)}
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();live=true;sourceImage=null;empty.style.display='none';status.textContent='LIVE';requestAnimationFrame(loop)}catch(err){console.error(err);status.textContent='CAMERA ERROR';alert('Safariのカメラ権限を許可してください。うまく開かない場合は中央シャッターでiPhone標準カメラを起動できます。')}}
async function flipCamera(){facing=facing==='environment'?'user':'environment';if(live)await startCamera()}
async function capture(){if(live&&video.readyState>=2){const w=video.videoWidth,h=video.videoHeight,snap=document.createElement('canvas');snap.width=w;snap.height=h;snap.getContext('2d').drawImage(video,0,0);const img=new Image();img.onload=()=>{sourceImage=img;live=false;status.textContent='CAPTURED';if(stream)stream.getTracks().forEach(t=>t.stop());renderImage(img,false)};img.src=snap.toDataURL('image/jpeg',.98);return}cameraFile.value='';cameraFile.click()}
function loadFile(f){if(!f)return;const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());live=false;sourceImage=img;seed=(Math.random()*1e9)|0;status.textContent='PHOTO';renderImage(img,false);URL.revokeObjectURL(url)};img.src=url}
async function makeOutputBlob(){if(!sourceImage&&!live)return null;let img=sourceImage;if(live){const snap=document.createElement('canvas');snap.width=video.videoWidth;snap.height=video.videoHeight;snap.getContext('2d').drawImage(video,0,0);img=new Image();await new Promise(res=>{img.onload=res;img.src=snap.toDataURL('image/jpeg',.98)})}const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,[ow,oh]=fitCanvas(w,h,4200),src=document.createElement('canvas');src.width=ow;src.height=oh;src.getContext('2d').drawImage(img,0,0,ow,oh);const out=document.createElement('canvas');processCanvas(src,out);return await new Promise(res=>out.toBlob(res,'image/jpeg',.96))}
async function shareImage(){const blob=await makeOutputBlob();if(!blob){alert('先に撮影するか写真を読み込んでください。');return}const f=new File([blob],'NOIR_CAMERA.jpg',{type:'image/jpeg'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'NOIR CAMERA'});status.textContent='SHARED'}else alert('JPEG保存を使ってください。')}catch(e){if(e&&e.name!=='AbortError')console.error(e)}}
async function save(){const blob=await makeOutputBlob();if(!blob){alert('先に撮影するか写真を読み込んでください。');return}const url=URL.createObjectURL(blob),a=document.createElement('a'),stamp=new Date().toISOString().replace(/[:.]/g,'-');a.href=url;a.download=`NOIR_${stamp}.jpg`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='SAVED'}
document.getElementById('cameraBtn').onclick=startCamera;document.getElementById('flipBtn').onclick=flipCamera;document.getElementById('shutter').onclick=capture;document.getElementById('loadBtn').onclick=()=>file.click();file.onchange=e=>loadFile(e.target.files?.[0]);cameraFile.onchange=e=>{const f=e.target.files?.[0];if(f){status.textContent='SHOT';loadFile(f)}};document.getElementById('saveBtn').onclick=save;document.getElementById('shareBtn').onclick=shareImage;document.getElementById('gridBtn').onclick=()=>guide.classList.toggle('on');document.getElementById('resetBtn').onclick=()=>{document.querySelector('[data-preset="hard"]').click();seed=1337;status.textContent=live?'LIVE':sourceImage?'PHOTO':'READY'};
stage.addEventListener('dragover',e=>e.preventDefault());stage.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files?.[0];if(f&&f.type.startsWith('image/'))loadFile(f)});window.addEventListener('resize',()=>{if(sourceImage&&!live)renderImage(sourceImage,false)});
})();
</script>
</body></html>
