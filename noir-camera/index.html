omparing=false;const defs=[['EXPOSURE','ex',-2,2,.05,0],['CONTRAST','co',.5,2.5,.05,1.12],['SATURATION','sa',0,1.8,.01,.78],['GLOW','gl',0,.6,.01,.10],['TEMPERATURE','te',-1,1,.01,-.10],['TINT','ti',-1,1,.01,.05],['FADE','fa',0,.4,.01,.12],['SOFTNESS','so',0,.75,.01,.22],['GRAIN','gr',0,.65,.01,.22],['GRAIN SIZE','gs',.5,4,.1,1],['CHROMA','ch',0,.45,.01,.10],['CLUSTER','cl',0,.8,.01,.28],['VIGNETTE','vi',0,.7,.01,.10]],vals={},byKey={};defs.forEach(d=>{vals[d[1]]=d[5];byKey[d[1]]=d});const groups=[defs.slice(0,8),defs.slice(8)];function fmt(d,x){return x.toFixed(d[1]==='gs'?1:2)}function setVal(d,x){x=Math.max(d[2],Math.min(d[3],x));vals[d[1]]=x;const el=$('k_'+d[1]);if(el){el.querySelector('.kval').textContent=fmt(d,x);el.style.setProperty('--p',(x-d[2])/(d[3]-d[2])*100)}if(frozen&&!comparing)renderStill()}function showPage(n){page=Math.max(0,Math.min(1,n));track.style.transform=`translateX(-${page*50}%)`;[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===page))}groups.forEach((g,gi)=>{const pg=document.createElement('div');pg.className='page';g.forEach(d=>{const box=document.createElement('div');box.className='k';box.innerHTML=`<div class="klabel">${d[0]}</div><div class="knob" id="k_${d[1]}"><span class="kval">${fmt(d,d[5])}</span></div>`;pg.appendChild(box);const k=box.querySelector('.knob');let sx,sy,sv,pid,intent;k.onpointerdown=e=>{e.preventDefault();pid=e.pointerId;k.setPointerCapture(pid);sx=e.clientX;sy=e.clientY;sv=vals[d[1]];intent=null};k.onpointermove=e=>{if(pid!==e.pointerId)return;e.preventDefault();const dx=e.clientX-sx,dy=e.clientY-sy;if(!intent&&Math.hypot(dx,dy)>9)intent=Math.abs(dy)>Math.abs(dx)*1.35?'knob':Math.abs(dx)>Math.abs(dy)*1.35?'page':null;if(intent==='knob')setVal(d,Math.round((sv-dy/150*(d[3]-d[2]))/d[4])*d[4])};k.onpointerup=e=>{if(intent==='page'&&Math.abs(e.clientX-sx)>35)showPage(page+(e.clientX<sx?1:-1));pid=null};k.ondblclick=e=>{e.preventDefault();setVal(d,d[5])}});track.appendChild(pg);const dot=document.createElement('span');dot.className='dot'+(gi?'':' on');dots.appendChild(dot)});function noise(x,y,s){let n=(x*374761393+y*668265263+s*69069)|0;n=(n^(n>>>13))*1274126177;return(((n^(n>>>16))>>>0)/4294967295)*2-1}const clamp=x=>Math.max(0,Math.min(255,x));function processCanvas(src,out,max=1200){const sc=Math.min(1,max/Math.max(src.width,src.height));out.width=src.width*sc;out.height=src.height*sc;const q=out.getContext('2d');q.drawImage(src,0,0,out.width,out.height);const im=q.getImageData(0,0,out.width,out.height),d=im.data;for(let i=0;i<d.length;i+=4){let r=d[i]*2**vals.ex,g=d[i+1]*2**vals.ex,b=d[i+2]*2**vals.ex,l=.2126*r+.7152*g+.0722*b;r=128+(r-128)*vals.co;g=128+(g-128)*vals.co;b=128+(b-128)*vals.co;if(mode==='bw')r=g=b=l;else{r=l+(r-l)*vals.sa+vals.te*25-vals.ti*4;g=l+(g-l)*vals.sa+vals.ti*14;b=l+(b-l)*vals.sa-vals.te*25-vals.ti*4}const p=i/4,x=p%out.width,y=Math.floor(p/out.width);if(window.NOIR_GRAIN_V08){[r,g,b]=window.NOIR_GRAIN_V08(r,g,b,l,x,y,seed,vals,mode,noise)}else{const gs=vals.gs,n=noise(Math.floor(x/gs),Math.floor(y/gs),seed)*vals.gr*105;r+=n;g+=n;b+=n}d[i]=clamp(r);d[i+1]=clamp(g);d[i+2]=clamp(b)}q.putImageData(im,0,0)}function draw(src,contain=false){const r=stage.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1),dw=c.width=r.width*dpr,dh=c.height=r.height*dpr;ctx.fillStyle='#000';ctx.fillRect(0,0,dw,dh);if(contain){const s=Math.min(dw/src.width,dh/src.height),w=src.width*s,h=src.height*s;ctx.drawImage(src,(dw-w)/2,(dh-h)/2,w,h)}else ctx.drawImage(src,0,0,dw,dh)}function renderStill(){if(!source)return;const p=document.createElement('canvas');processCanvas(source,p);draw(p,sourceKind==='library')}function rawStill(){if(source)draw(source,sourceKind==='library')}function liveSource(){if(v.readyState<2)return null;const t=document.createElement('canvas');t.width=v.videoWidth/lens;t.height=v.videoHeight/lens;t.getContext('2d').drawImage(v,(v.videoWidth-t.width)/2,(v.videoHeight-t.height)/2,t.width,t.height,0,0,t.width,t.height);return t}function lo e('active',x===b));if(frozen)renderStill()});$('heavy').onclick=()=>{setVal(byKey.gr,.42);setVal(byKey.gs,1.15);setVal(byKey.cl,.48);showPage(1)};$('live').onclick=start;$('shot').onclick=capture;$('library').onclick=()=>file.click();file.onchange=e=>loadPhoto(e.target.files[0]);$('save').onclick=()=>{if(!source)return;const out=document.createElement('canvas');processCanvas(source,out,3600);out.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='NOIR.jpg';a.click()},'image/jpeg',.96)};showPage(0);</script></body></html>
