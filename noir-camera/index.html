<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#050505"><title>NOIR CAMERA v0.5</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100%;overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}header{padding:max(12px,env(safe-area-inset-top)) 12px 9px;background:#080808;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}.brand{font-size:12px;font-weight:700;letter-spacing:.18em}.sub{font-size:9px;color:#888;margin-top:3px;letter-spacing:.1em}.stage{position:relative;overflow:hidden;background:#000}video{position:absolute;width:1px;height:1px;opacity:0}canvas{width:100%;height:100%;object-fit:cover}.status{position:absolute;top:10px;left:10px;background:#000a;border:1px solid #ffffff22;padding:6px 9px;border-radius:20px;font-size:10px}.controls{background:#090909;padding:9px 10px max(10px,env(safe-area-inset-bottom));overflow:auto;max-height:48dvh}.row{display:flex;gap:7px;overflow:auto;margin-bottom:8px}.chip{border:1px solid #333;background:#111;color:#ddd;border-radius:20px;padding:8px 12px;white-space:nowrap;font-size:11px}.chip.active{background:#eee;color:#000;border-color:#eee;font-weight:700}.chip:disabled{opacity:.3}.info{font-size:9px;color:#888;margin:-2px 2px 8px;line-height:1.4}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}.ctl label{display:flex;justify-content:space-between;font-size:9px;color:#aaa}.ctl input{width:100%;accent-color:#fff}.shoot{display:grid;grid-template-columns:1fr 78px 1fr;align-items:center;gap:10px;margin-top:8px}.btn{height:43px;border:1px solid #333;background:#111;color:#fff;border-radius:12px}.shutter{width:68px;height:68px;border-radius:50%;background:#eee;border:7px solid #171717;box-shadow:0 0 0 2px #eee inset;justify-self:center}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#999;font-size:12px;line-height:1.7;padding:30px;pointer-events:none}</style></head><body><div class="app"><header><div><div class="brand">NOIR CAMERA</div><div class="sub">COLOR / ADAPTIVE ZOOM / FILM GRAIN</div></div><button class="chip" id="flip">↺</button></header><div class="stage"><video id="v" playsinline muted autoplay></video><canvas id="c"></canvas><div class="status" id="status">READY</div><div class="empty" id="empty">LIVEを押してカメラを開始<br>利用可能な画角を自動検出します</div></div><div class="controls"><div class="row" id="lens"><button class="chip lens" data-lens="0.5">0.5×</button><button class="chip lens active" data-lens="1">1×</button><button class="chip lens" data-lens="2">2×</button><button class="chip lens" data-lens="3">3×</button></div><div class="info" id="lensInfo">起動後にiPhoneがSafariへ公開しているズーム機能を確認します</div><div class="row"><button class="chip active" data-mode="color">COLOR</button><button class="chip" data-mode="bw">B&W</button><button class="chip" id="heavy">GRAIN HEAVY</button></div><div class="sliders"><div class="ctl"><label>EXPOSURE <span id="oe">0.00</span></label><input id="ex" type="range" min="-2" max="2" step=".05" value="0"></div><div class="ctl"><label>CONTRAST <span id="oc">1.12</span></label><input id="co" type="range" min=".5" max="2.5" step=".05" value="1.12"></div><div class="ctl"><label>SATURATION <span id="os">0.78</span></label><input id="sa" type="range" min="0" max="1.8" step=".01" value=".78"></div><div class="ctl"><label>GRAIN <span id="og">0.22</span></label><input id="gr" type="range" min="0" max=".55" step=".01" value=".22"></div></div><div class="shoot"><button class="btn" id="live">LIVE</button><button class="shutter" id="shot"></button><button class="btn" id="save">JPEG保存</button></div></div></div><script>const $=x=>document.getElementById(x),v=$('v'),c=$('c'),ctx=c.getContext('2d',{willReadFrequently:true}),status=$('status'),empty=$('empty'),info=$('lensInfo');let stream=null,front=false,mode='color',lens=1,raf=0,seed=12345,nativeZoom=false,zmin=1,zmax=1;const ex=$('ex'),co=$('co'),sa=$('sa'),gr=$('gr');function noise(x,y,s){let n=(x*374761393+y*668265263+s*69069)|0;n=(n^(n>>>13))*1274126177;return(((n^(n>>>16))>>>0)/4294967295)*2-1}function clamp(x){return Math.max(0,Math.min(255,x))}function process(){if(v.readyState<2)return;const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return;const max=900,sc=Math.min(1,max/Math.max(vw,vh));c.width=Math.round(vw*sc);c.height=Math.round(vh*sc);let sx=0,sy=0,sw=vw,sh=vh;if(!nativeZoom&&lens>1){sw=vw/lens;sh=vh/lens;sx=(vw-sw)/2;sy=(vh-sh)/2}ctx.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);const im=ctx.getImageData(0,0,c.width,c.height),d=im.data,gain=2**(+ex.value),contrast=+co.value,sat=+sa.value,grain=+gr.value*120;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){let i=(y*c.width+x)*4,r=d[i]*gain,g=d[i+1]*gain,b=d[i+2]*gain;r=128+(r-128)*contrast;g=128+(g-128)*contrast;b=128+(b-128)*contrast;let l=.2126*r+.7152*g+.0722*b;if(mode==='bw')r=g=b=l;else{r=l+(r-l)*sat;g=l+(g-l)*sat;b=l+(b-l)*sat;r-=4;g+=2;b+=7}let n=noise(x,y,seed)*grain*(.65+.35*(1-Math.abs(l-128)/128));r+=n;g+=n;b+=n;if(mode==='color'){r+=noise(x,y,seed+17)*grain*.22;g+=noise(x,y,seed+43)*grain*.17;b+=noise(x,y,seed+91)*grain*.27}d[i]=clamp(r);d[i+1]=clamp(g);d[i+2]=clamp(b)}ctx.putImageData(im,0,0)}function loop(){process();raf=requestAnimationFrame(loop)}async function detect(){nativeZoom=false;zmin=1;zmax=1;const t=stream?.getVideoTracks()[0];try{const caps=t?.getCapabilities?t.getCapabilities():{};if(caps.zoom&&Number.isFinite(caps.zoom.min)&&Number.isFinite(caps.zoom.max)){nativeZoom=true;zmin=caps.zoom.min;zmax=caps.zoom.max}}catch(e){}document.querySelectorAll('.lens').forEach(b=>{let z=+b.dataset.lens;b.disabled=z<1||(nativeZoom&&(z<zmin||z>zmax))});if(nativeZoom)info.textContent=`Safari公開ズーム: ${zmin.toFixed(1)}×〜${zmax.toFixed(1)}× / NATIVE`;else info.textContent='Safariは実レンズ/zoomを公開していません。1×以上はクロップで可変、0.5×は利用不可です。'}async function applyZoom(){if(!nativeZoom||!stream)return;const t=stream.getVideoTracks()[0];try{await t.applyConstraints({advanced:[{zoom:lens}]})}catch(e){nativeZoom=false;info.textContent='ネイティブzoom適用不可。クロップ方式へ切り替えました。'}}async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:front?'user':'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;await v.play();empty.style.display='none';await detect();if(lens<1||document.querySelector(`.lens[data-lens="${lens}"]`)?.disabled)lens=1;await applyZoom();document.querySelectorAll('.lens').forEach(b=>b.classList.toggle('active',+b.dataset.lens===lens));status.textContent=`LIVE ${lens}× ${nativeZoom?'NATIVE':'CROP'}`;cancelAnimationFrame(raf);loop()}catch(e){console.error(e);status.textContent='CAMERA ERROR';alert('カメラを開始できませんでした。Safariのカメラ許可を確認してください。')}}async function changeLens(n){n=+n;if(n<1){status.textContent='0.5× UNAVAILABLE';info.textContent='0.5×はSafariが超広角レンズを公開しないため、このWeb版では利用できません。';return}lens=n;document.querySelectorAll('.lens').forEach(b=>b.classList.toggle('active',+b.dataset.lens===lens));if(!stream)await start();else await applyZoom();status.textContent=`LIVE ${lens}× ${nativeZoom?'NATIVE':'CROP'}`}document.querySelectorAll('.lens').forEach(b=>b.onclick=()=>{if(!b.disabled)changeLens(b.dataset.lens)});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});$('heavy').onclick=()=>{gr.value=.42;co.value=1.18;sa.value=.72;seed=Math.random()*1e9|0;upd()};function upd(){$('oe').textContent=(+ex.value).toFixed(2);$('oc').textContent=(+co.value).toFixed(2);$('os').textContent=(+sa.value).toFixed(2);$('og').textContent=(+gr.value).toFixed(2)}[ex,co,sa,gr].forEach(x=>x.oninput=upd);upd();$('live').onclick=start;$('flip').onclick=async()=>{front=!front;lens=1;await start()};$('shot').onclick=()=>{seed=Math.random()*1e9|0;process();status.textContent='CAPTURED'};$('save').onclick=()=>{process();c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='NOIR_'+Date.now()+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/jpeg',.96)};</script></body></html>
