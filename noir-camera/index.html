<script>(()=>{const $=id=>document.getElementById(id),video=$('video'),view=$('view'),empty=$('empty'),status=$('status'),file=$('file'),cameraFile=$('cameraFile'),guide=$('guide');const controls={exposure:$('exposure'),contrast:$('contrast'),saturation:$('saturation'),temperature:$('temperature'),tint:$('tint'),fade:$('fade'),softness:$('softness'),glow:$('glow'),grain:$('grain'),chroma:$('chroma'),grainSize:$('grainSize'),vignette:$('vignette')};const outs={exposure:$('oExposure'),contrast:$('oContrast'),saturation:$('oSaturation'),temperature:$('oTemperature'),tint:$('oTint'),fade:$('oFade'),softness:$('oSoftness'),glow:$('oGlow'),grain:$('oGrain'),chroma:$('oChroma'),grainSize:$('oGrainSize'),vignette:$('oVignette')};let stream=null,facing='environment',sourceImage=null,live=false,lastFrame=0,seed=1337,currentMode='color';const sets={color:[['BLUE DUSK',[.18,1.10,.80,-.14,.04,.12,.24,.10,.18,.08,1,.10]],['POLA FADE',[.28,.95,.72,.06,.02,.20,.28,.12,.16,.05,1,.08]],['FLASH GIRL',[.24,1.20,.88,-.08,.05,.09,.18,.15,.22,.10,1,.10]],['ROOM MINT',[.14,1,.78,-.04,-.02,.18,.25,.08,.14,.04,1,.06]],['GRAIN HEAVY',[-.02,1.18,.72,-.10,.03,.10,.10,.06,.42,.18,1,.14]]],bw:[['HARD SUN',[.30,1.70,0,0,0,0,.02,.10,.12,0,1,.13]],['SKY GRAIN',[.12,1.34,0,0,0,0,.02,.02,.18,0,1,.10]],['DEEP VOID',[-.60,2.10,0,0,0,0,0,.08,.08,0,1,.30]],['CLOUD DRAMA',[.05,1.66,0,0,0,0,0,.04,.16,0,1,.18]],['NIGHT BLOOM',[.45,1.85,0,0,0,0,0,.36,.14,0,2,.22]]]};const keys=Object.keys(controls);function fmt(k,v){return k==='grainSize'?Math.round(v):(['exposure','temperature','tint'].includes(k)&&v>=0?'+':'')+Number(v).toFixed(2)}function outputs(){keys.forEach(k=>outs[k].textContent=fmt(k,+controls[k].value))}function apply(vals){keys.forEach((k,i)=>controls[k].value=vals[i]);outputs();seed=Math.random()*1e9|0;if(sourceImage&&!live)render(sourceImage)}function presets(){const w=$('presets');w.innerHTML='';sets[currentMode].forEach((p,i)=>{const b=document.createElement('button');b.className='chip'+(!i?' a lement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');q.filter=`blur(${Math.max(1,Math.round(Math.min(w,h)*(.004+p.softness*.015)))}px)`;q.drawImage(dst,0,0);dc.globalAlpha=Math.min(.78,p.softness*.8);dc.drawImage(c,0,0);dc.globalAlpha=1}if(p.glow){const c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');q.filter=`blur(${Math.max(2,Math.round(Math.min(w,h)*.012))}px) brightness(${1.35+p.glow*2})`;q.drawImage(dst,0,0);dc.globalCompositeOperation='screen';dc.globalAlpha=Math.min(.62,p.glow);dc.drawImage(c,0,0);dc.globalAlpha=1;dc.globalCompositeOperation='source-over'}}function fit(w,h,m){const s=Math.min(1,m/Math.max(w,h));return[Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s))]}function render(img){empty.style.display='none';const nw=img.videoWidth||img.naturalWidth||img.width,nh=img.videoHeight||img.naturalHeight||img.height;if(!nw)return;const [w,h]=fit(nw,nh,innerWidth<760?960:1280),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);process(c,view)}function loop(t){if(!live)return;requestAnimationFrame(loop);if(t-lastFrame<75)return;lastFrame=t;if(video.readyState>=2)render(video)}async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();live=true;sourceImage=null;empty.style.display='none';status.textContent='LIVE';requestAnimationFrame(loop)}catch(e){status.textContent='CAMERA ERROR';alert('カメラを開始できません。Safariのカメラ許可を確認してください。')}}async function capture(){if(live&&video.readyState>=2){const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);const im=new Image;im.onload=()=>{sourceImage=im;live=false;if(stream)stream.getTracks().forEach(t=>t.stop());status.textContent='CAPTURED';render(im)};im.src=c.t
