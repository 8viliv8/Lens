<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#050505"><title>NOIR CAMERA VIDEO TEST</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:1fr auto}.stage{position:relative;overflow:hidden;background:#000}.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.stage canvas{display:none}.status{position:absolute;z-index:3;top:max(12px,env(safe-area-inset-top));left:12px;background:#0009;border:1px solid #ffffff2a;border-radius:20px;padding:7px 10px;font-size:11px}.controls{padding:12px 12px max(12px,env(safe-area-inset-bottom));background:#090909;display:grid;grid-template-columns:1fr 72px 1fr;gap:10px;align-items:center}.btn{height:46px;border:1px solid #333;background:#151515;color:#fff;border-radius:14px}.shutter{width:68px;height:68px;border-radius:50%;background:#eee;border:8px solid #202020;justify-self:center}.note{position:absolute;bottom:12px;left:12px;right:12px;text-align:center;font-size:10px;color:#ddd;background:#0008;padding:7px;border-radius:10px;pointer-events:none}</style></head><body><div class="app"><div class="stage"><video id="v" playsinline muted autoplay></video><canvas id="c"></canvas><div class="status" id="s">READY</div><div class="note" id="n">LIVE = Safari video direct / 撮影後のみ Canvas</div></div><div class="controls"><button class="btn" id="live">LIVE</button><button class="shutter" id="shot"></button><button class="btn" id="back">RETAKE</button></div></div><script>const v=document.getElementById('v'),c=document.getElementById('c'),s=document.getElementById('s'),n=document.getElementById('n');let stream=null;async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());c.style.display='none';v.style.display='block';s.textContent='REQUESTING CAMERA';stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;await v.play();s.textContent='LIVE VIDEO';n.textContent='この映像はCanvasではなくvideoを直接表示しています'}catch(e){s.textContent='CAMERA ERROR: '+(e.name||'unknown');n.textContent=e.message||'カメラを開始できませんでした'}}function capture(){if(!stream||v.readyState<2)return;const vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return;c.width=vw;c.height=vh;c.getContext('2d').drawImage(v,0,0,vw,vh);c.style.display='block';v.style.display='none';stream.getTracks().forEach(t=>t.stop());stream=null;s.textContent='CAPTURED';n.textContent='撮影時に1回だけvideo → Canvasへ転写'}document.getElementById('live').onclick=start;document.getElementById('back').onclick=start;document.getElementById('shot').onclick=capture;start();</script></body></html>
