<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lens</title>
<style>
:root{
    --paper:#f7f6f2; --ink:#3a3d42; --mint:#9db4a8;
    --panel:rgba(250,249,246,0.92); --line:rgba(90,90,86,0.14); --label:rgba(70,72,76,0.55);
    --serif:'Yu Mincho','YuMincho','Hiragino Mincho ProN',serif;
    --ui:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Hiragino Kaku Gothic ProN',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--ui);}
body{background:var(--paper);}
#stage{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000;}
#bgImg{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none;position:relative;z-index:0;}
#stage.paper-mode{background:var(--paper);}
#paperLensImg{position:absolute;z-index:1;pointer-events:none;filter:drop-shadow(0 6px 26px rgba(120,130,140,.15));}

#fallLayer,#partLayer{position:fixed;inset:0;overflow:hidden;pointer-events:none;-webkit-mask:var(--lensmask);mask:var(--lensmask);}
#partLayer{z-index:2;} #fallLayer{z-index:3;}
.drip{position:absolute;font-family:var(--serif);white-space:nowrap;user-select:none;}
.drip.rainw{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:5px;animation:fall linear forwards;}
@keyframes fall{0%{transform:translateY(-160px);}100%{transform:translateY(112vh);}}
.drip.starw{writing-mode:horizontal-tb;letter-spacing:3px;font-weight:300;animation:twinkle ease-in-out both;}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.84);}50%{opacity:var(--op,.6);transform:scale(1);}}

#lensZone{position:fixed;z-index:6;pointer-events:none;}
#lensZone.show{border:1px dashed rgba(157,180,168,0.7);border-radius:50%;}
.lensword{position:absolute;font-family:var(--serif);white-space:nowrap;letter-spacing:.16em;opacity:0;}
@keyframes lw-fade{0%{opacity:0;filter:blur(4px);}22%{opacity:var(--lop,.9);filter:blur(.5px);}78%{opacity:var(--lop,.9);}100%{opacity:0;filter:blur(3px);}}
@keyframes lw-sway{0%{opacity:0;transform:rotate(-1.2deg);}22%{opacity:var(--lop,.9);}50%{transform:translateX(4px) rotate(1.2deg);}78%{opacity:var(--lop,.9);}100%{opacity:0;transform:rotate(-1deg);}}
@keyframes lw-tremble{0%{opacity:0;}22%{opacity:var(--lop,.9);}78%{opacity:var(--lop,.9);}100%{opacity:0;}}
@keyframes lw-shake{0%{margin-left:0;margin-top:0;}25%{margin-left:.6px;margin-top:-.5px;}50%{margin-left:-.5px;margin-top:.6px;}75%{margin-left:.5px;margin-top:.4px;}100%{margin-left:-.4px;margin-top:-.5px;}}
@keyframes lw-nijimi{0%{opacity:0;filter:blur(7px);letter-spacing:.4em;}30%{opacity:var(--lop,.9);}70%{opacity:var(--lop,.9);filter:blur(.4px);letter-spacing:.16em;}100%{opacity:0;filter:blur(5px);letter-spacing:.34em;}}

#dot{position:fixed;top:20px;left:20px;z-index:120;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,0.25);background:rgba(20,20,22,0.45);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.45;transition:opacity .5s;}
#dot svg{width:16px;height:16px;stroke:#cfd8d4;fill:none;stroke-width:1.5;}
#dot:hover{opacity:1;}
body.idle #dot{opacity:.08;}

#panel{position:fixed;top:0;left:0;z-index:130;height:100%;width:min(330px,90vw);background:var(--panel);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-right:1px solid var(--line);padding:24px 22px 40px;overflow-y:auto;transform:translateX(-103%);transition:transform .45s cubic-bezier(.3,.7,.3,1);}
#panel.open{transform:translateX(0);}
#panel *{color:var(--ink);}
.brand{font-family:var(--serif);font-size:1.5rem;letter-spacing:.5em;margin-bottom:2px;padding-left:.4em;font-weight:400;}
.tagline{font-size:9px;letter-spacing:2px;color:var(--label);margin-bottom:22px;}
#closeP{position:absolute;top:22px;right:18px;background:none;border:none;color:var(--label);font-size:20px;cursor:pointer;}
.sec{border-top:1px solid var(--line);}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;cursor:pointer;font-size:10px;letter-spacing:2.5px;color:var(--mint);text-transform:uppercase;font-weight:600;}
.sec-h .arw{transition:transform .3s;opacity:.6;font-size:9px;}
.sec.open .sec-h .arw{transform:rotate(90deg);}
.sec-b{max-height:0;overflow:hidden;transition:max-height .4s ease;}
.sec.open .sec-b{max-height:700px;}
.sec-b-inner{padding:2px 2px 16px;}
.field{margin-bottom:14px;}
.fname{font-size:10px;letter-spacing:1px;color:var(--label);margin-bottom:7px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:7px 14px;font-size:11px;cursor:pointer;transition:all .2s;font-family:var(--ui);opacity:.7;}
.chip:hover{opacity:1;} .chip.on{background:rgba(157,180,168,.18);border-color:var(--mint);opacity:1;}
.swatches{display:flex;gap:10px;} .sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border .2s;box-shadow:0 1px 3px rgba(0,0,0,.15);} .sw:hover{transform:scale(1.12);} .sw.on{border-color:var(--mint);}
.slider-row{display:flex;align-items:center;gap:12px;}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent;cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--mint);margin-top:-6.5px;box-shadow:0 1px 4px rgba(0,0,0,.2);}
input[type=range]::-moz-range-track{height:2px;background:var(--line);border-radius:2px;}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--mint);}
.sval{font-size:10px;color:var(--label);min-width:34px;text-align:right;font-variant-numeric:tabular-nums;}
select{width:100%;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:12px;font-family:var(--ui);}
select option{background:#20242a;color:#fff;}
.file-field{display:inline-flex;align-items:center;gap:8px;font-size:11px;color:var(--mint);border:1px solid var(--line);border-radius:20px;padding:8px 15px;cursor:pointer;}
.file-field input{display:none;}
.note{font-size:9px;color:var(--label);letter-spacing:.5px;line-height:1.7;margin-top:8px;}
#dot.saved svg{stroke:var(--mint);}

/* 起動画面：Lensの文字のみ */
#curtain{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:opacity 1s;-webkit-tap-highlight-color:transparent;}
#curtain .bname{font-family:var(--serif);font-size:2.5rem;letter-spacing:.42em;color:var(--ink);padding-left:.42em;font-weight:400;margin-bottom:28px;user-select:text;}
/* 隠された円：背景と全く同じ色。選択（ドラッグ）した時だけ、選択のハイライトの中に"影"として浮かび上がる。
   "みる"ことが"みつける"ことにつながる、という個人的な意味を込めた仕掛け。 */
#curtain .bname .hidden-dot{color:var(--paper);-webkit-text-fill-color:var(--paper);}
#curtain .bname ::selection, #curtain .bname .hidden-dot::selection{background:rgba(157,180,168,0.38);color:var(--paper);-webkit-text-fill-color:var(--paper);}
.divider-thin{width:120px;height:1px;background:rgba(58,61,66,0.16);margin:0 auto 26px;}
#curtain .go{font-size:10px;letter-spacing:5px;color:var(--mint);border:1px solid rgba(157,180,168,.4);border-radius:24px;padding:13px 40px;transition:all .3s;}
#curtain:active .go{background:rgba(157,180,168,.12);}
#curtain .sub{font-size:9px;letter-spacing:2px;color:var(--label);}
#badge{position:fixed;bottom:10px;right:12px;z-index:100;font-size:9px;letter-spacing:1px;color:rgba(157,180,168,.5);}
</style>
</head>
<body>
<div id="stage">
    <img id="bgImg" alt="" style="display:none;">
</div>
<div id="partLayer"></div>
<div id="fallLayer"></div>
<div id="lensZone"></div>

<div id="dot"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15" y1="15" x2="20" y2="20"/></svg></div>

<div id="panel">
    <button id="closeP">×</button>
    <div class="brand">Lens</div>
    <div class="tagline">言葉の海から、ひとつを拾う</div>
    <div class="sec open"><div class="sec-h">背景<span class="arw">▶</span></div><div class="sec-b"><div class="sec-b-inner"><div class="field"><div class="chips" id="bgChips" data-chipgroup="bg"><button class="chip on" data-v="bg4">透目</button><button class="chip" data-v="bg1">古書</button><button class="chip" data-v="bg2">波形</button><button class="chip" data-v="bg3">理科室</button><button class="chip" data-v="paper">無</button></div></div><div class="field"><label class="file-field">自分の絵を選ぶ<input type="file" id="bgFile" accept="image/*"></label></div></div></div></div><div class="sec"><div class="sec-h">単語帳<span class="arw">▶</span></div><div class="sec-b"><div class="sec-b-inner"><div class="field"><select id="bookSel"></select><div class="note">♪ は声つきの単語帳。</div></div></div></div></div><div class="sec"><div class="sec-h">文字の色<span class="arw">▶</span></div><div class="sec-b"><div class="sec-b-inner"><div class="field"><div class="swatches" id="colorSw"></div></div></div></div></div><div class="sec"><div class="sec-h">文字の流れ（外）<span class="arw">▶</span></div><div class="sec-b"><div class="sec-b-inner"><div class="field"><div class="chips" id="flowChips" data-chipgroup="flow"><button class="chip on" data-v="none">なし</button><button class="chip" data-v="rain">RAIN（雨）</button><button class="chip" data-v="star">STAR（オルゴール）</button></div></div><div class="field"><div class="fname">流れる速さ</div><div class="slider-row"><input type="range" id="fSpeed" min="0.3" max="3" step="0.1" value="1"><span class="sval" id="fSpeedV">1.0</span></div></div><div class="field"><div class="fname">流れる量</div><div class="slider-row"><input type="range" id="fDensity" min="1" max="12" step="1" value="5"><span class="sval" id="fDensityV">5</span></div></div><div class="field"><div class="fname">大きさ</div><div class="slider-row"><input type="range" id="fSize" min="0.6" max="2.6" step="0.1" value="1.05"><span class="sval" id="fSizeV">1.1</span></div></div><div class="field"><div class="fname">濃さ</div><div class="slider-row"><input type="range" id="fOp" min="0.15" max="1" step="0.05" value="0.62"><span class="sval" id="fOpV">.62</span></div></div><div class="field"><div class="fname">ぼかし</div><div class="slider-row"><input type="range" id="fBlur" min="0" max="5" step="0.1" value="1.1"><span class="sval" id="fBlurV">1.1</span></div></div></div></div></div><div class="sec"><div class="sec-h">音<span class="arw">▶</span></div><div class="sec-b"><div class="sec-b-inner"><div class="field"><div class="fname">藤本さんの声</div><div class="slider-row"><input type="range" id="voiceVol" min="0" max="1" step="0.05" value="0.8"><span class="sval" id="voiceVolV">.80</span></div></div><div class="field"><div class="fname">環境音（雨／オルゴール）</div><div class="slider-row"><input type="range" id="ambientVol" min="0" max="0.5" step="0.02" value="0"><span class="sval" id="ambientVolV">.00</span></div></div><div class="note">環境音は最初ミュートです。「文字の流れ」でRAIN/STARを選ぶと、音量を上げた分だけ鳴ります。</div></div></div></div><div class="sec"><div class="sec-h">レンズの中<span class="arw">▶</span></div><div class="sec-b"><div class="sec-b-inner"><div class="field"><div class="fname">間隔</div><div class="slider-row"><input type="range" id="interval" min="1" max="10" step="0.5" value="4"><span class="sval" id="intervalV">4.0s</span></div></div><div class="field"><div class="fname">大きさ</div><div class="slider-row"><input type="range" id="lSize" min="0.5" max="2.5" step="0.1" value="1"><span class="sval" id="lSizeV">1.0</span></div></div><div class="field"><div class="fname">濃さ</div><div class="slider-row"><input type="range" id="lOp" min="0.3" max="1" step="0.05" value="0.9"><span class="sval" id="lOpV">.90</span></div></div><div class="field"><div class="fname">動き</div><div class="chips" id="moveChips" data-chipgroup="lMove"><button class="chip on" data-v="fade">フェード</button><button class="chip" data-v="sway">揺れ</button><button class="chip" data-v="tremble">震え</button><button class="chip" data-v="nijimi">滲み</button></div></div><div class="field"><div class="fname">馴染み</div><div class="chips" id="blendChips" data-chipgroup="lBlend"><button class="chip on" data-v="multiply">影</button><button class="chip" data-v="normal">素</button><button class="chip" data-v="overlay">光</button></div></div></div></div></div><div class="note" style="border-top:1px solid var(--line);padding-top:12px;">設定はこの端末に自動保存されます。</div>
</div>

<div id="badge"></div>

<div id="curtain">
    <div class="bname">Lens<span class="hidden-dot">○</span></div>
    <div class="divider-thin"></div>
    <div class="go" id="goBtn">のぞく</div>
    <div class="sub">"みる"こと。でも、"つむる"こと。</div>
</div>

/* ===== 背景・レンズ配置 ===== */
const stage=document.getElementById('stage'),bgImg=document.getElementById('bgImg'),paperLens=document.getElementById('paperLensImg'),zone=document.getElementById('lensZone');
let LC={x:0,y:0,r:0};

function applyBg(){
    if(state.bg==='paper'){
        // 「無」：真っ白のみ。レンズも背景画像も出さない
        stage.classList.add('paper-mode');
        bgImg.style.display='none';
    } else if(state.bg==='custom' && customBgData){
        stage.classList.remove('paper-mode');
        bgImg.src=customBgData; bgImg.style.display='block';
    } else {
        stage.classList.remove('paper-mode');
        bgImg.src=BGDATA[state.bg]; bgImg.style.display='block';
    }
}

function layoutLens(){
    if(state.bg==='paper'){
        LC={x:innerWidth*0.5,y:innerHeight*0.5,r:0};
        zone.style.width='0px'; zone.style.height='0px';
        document.documentElement.style.setProperty('--lensmask','none');
        return;
    }
    const vw=innerWidth, vh=innerHeight;
    if(state.bg==='custom'){
        const rect=bgImg.getBoundingClientRect();
        const z=state.customZone||{cx:50,cy:50,r:26};
        const cx=rect.left+rect.width*z.cx/100, cy=rect.top+rect.height*z.cy/100, r=rect.width*z.r/100;
        LC={x:cx,y:cy,r:r};
    } else {
        const rect=bgImg.getBoundingClientRect();
        const z=ZONES[state.bg];
        const cx=rect.left+rect.width*z.cx/100, cy=rect.top+rect.height*z.cy/100, r=rect.width*z.r/100;
        LC={x:cx,y:cy,r:r};
    }
    zone.style.left=(LC.x-LC.r)+'px'; zone.style.top=(LC.y-LC.r)+'px'; zone.style.width=(2*LC.r)+'px'; zone.style.height=(2*LC.r)+'px';
    const mr=LC.r*0.97;
    document.documentElement.style.setProperty('--lensmask',`radial-gradient(circle at ${LC.x}px ${LC.y}px, transparent ${mr}px, #000 ${mr+2}px)`);
}
bgImg.addEventListener('load',layoutLens);

/* ===== Web Audio: 藤本さんの声（wav） ===== */
let AC=null,voiceGain=null,ambientGain=null;const bufCache={},fetching={};
function initAudio(){
    if(AC)return;
    AC=new (window.AudioContext||window.webkitAudioContext)();
    voiceGain=AC.createGain(); voiceGain.gain.value=state.voiceVol; voiceGain.connect(AC.destination);
    ambientGain=AC.createGain(); ambientGain.gain.value=0; ambientGain.connect(AC.destination);
    const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0);
}
function ensureRun(){ if(AC&&AC.state==='suspended')AC.resume(); }
function loadBuf(folder,file){ const key=folder+'/'+file; if(bufCache[key])return Promise.resolve(bufCache[key]); if(fetching[key])return fetching[key]; const url=folder+'/'+encodeURIComponent(file)+'.wav'; fetching[key]=fetch(url).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(ab=>new Promise((res,rej)=>AC.decodeAudioData(ab,res,rej))).then(buf=>{bufCache[key]=buf;delete fetching[key];return buf;}).catch(e=>{delete fetching[key];throw e;}); return fetching[key]; }
function playVoice(folder,file){ if(!folder)return; ensureRun(); loadBuf(folder,file).then(buf=>{const s=AC.createBufferSource();s.buffer=buf;s.connect(voiceGain);s.start(0);}).catch(()=>{}); }

function stopAmbient(){
    clearTimeout(toneTimeout);
    ambientSources.forEach(s=>{try{s.stop();s.disconnect();}catch(e){}});
    ambientLfos.forEach(l=>{try{l.stop();l.disconnect();}catch(e){}});
    ambientSources=[];ambientLfos=[];
}
function startAmbient(){
    if(!AC)return;
    stopAmbient();
    if(state.flow==='rain'){
        const s=makeNoise(),hp=AC.createBiquadFilter(),lp=AC.createBiquadFilter(),g=AC.createGain();
        hp.type='highpass';hp.frequency.value=420;lp.type='lowpass';lp.frequency.value=5200;g.gain.value=0.5;
        s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(ambientGain);s.start();ambientSources.push(s);
        const dr=makeNoise(),bp=AC.createBiquadFilter(),dg=AC.createGain();
        bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=0.7;dg.gain.value=0.1;
        dr.connect(bp);bp.connect(dg);dg.connect(ambientGain);dr.start();ambientSources.push(dr);
        toneLoop(true);
    } else if(state.flow==='star'){
        const b=makeNoise(),blp=AC.createBiquadFilter(),bg=AC.createGain();
        blp.type='lowpass';blp.frequency.value=900;bg.gain.value=0.16;
        b.connect(blp);blp.connect(bg);bg.connect(ambientGain);b.start();ambientSources.push(b);
        [{f:3200,q:2.5,lfo:6.5,d:0.5,v:0.07},{f:4200,q:2.2,lfo:8.5,d:0.5,v:0.055},{f:5100,q:2.0,lfo:5.2,d:0.45,v:0.04}].forEach(ins=>{
            const s=makeNoise(),ibp=AC.createBiquadFilter(),g=AC.createGain();
            ibp.type='bandpass';ibp.frequency.value=ins.f;ibp.Q.value=ins.q;g.gain.value=ins.v;
            const lfo=AC.createOscillator(),lg=AC.createGain();
            lfo.type='sine';lfo.frequency.value=ins.lfo;lg.gain.value=ins.v*ins.d;
            lfo.connect(lg);lg.connect(g.gain);lfo.start();
            s.connect(ibp);ibp.connect(g);g.connect(ambientGain);s.start();
            ambientSources.push(s);ambientLfos.push(lfo);
        });
        toneLoop(false);
    }
}
function playTone(isRain){
    if(!AC)return;
    const scale=[185,220,277.18,329.63,369.99,440,554.37,659.25];
    let freq=scale[Math.floor(Math.random()*scale.length)];
    if(!isRain)freq*=1; else freq*=4;
    const now=AC.currentTime;
    const o1=AC.createOscillator(),o2=AC.createOscillator(),g1=AC.createGain(),g2=AC.createGain();
    o1.type='sine';o1.frequency.value=freq;o2.type='triangle';o2.frequency.value=freq*2;
    const vol=state.ambientVol;
    if(!isRain){
        g1.gain.setValueAtTime(0,now);g1.gain.linearRampToValueAtTime(vol*0.4,now+0.01);g1.gain.exponentialRampToValueAtTime(0.001,now+4.5);
        g2.gain.setValueAtTime(0,now);g2.gain.linearRampToValueAtTime(vol*0.1,now+0.005);g2.gain.exponentialRampToValueAtTime(0.001,now+0.3);
    }else{
        g1.gain.setValueAtTime(0,now);g1.gain.linearRampToValueAtTime(vol*0.25,now+0.005);g1.gain.exponentialRampToValueAtTime(0.001,now+2);
        g2.gain.setValueAtTime(0,now);g2.gain.linearRampToValueAtTime(vol*0.05,now+0.002);g2.gain.exponentialRampToValueAtTime(0.001,now+0.1);
    }
    o1.connect(g1);g1.connect(ambientGain);o2.connect(g2);g2.connect(ambientGain);
    o1.start(now);o2.start(now);o1.stop(now+5);o2.stop(now+5);
}
function toneLoop(isRain){ clearTimeout(toneTimeout); toneTimeout=setTimeout(()=>{ if(state.ambientVol>0)playTone(isRain); toneLoop(isRain); },3000+Math.random()*4000); }

/* ===== レンズの中の言葉 ===== */
let li=-1;
function curBook(){ return WORDBOOKS[state.book]||WORDBOOKS['言葉']; }
function spawnLens(){
    if(state.bg==='paper')return; // 「無」：文字も声も出さない
    const book=curBook(),words=book.words; if(!words.length)return;
    let n;do{n=Math.floor(Math.random()*words.length);}while(n===li&&words.length>1);li=n;
    const wd=words[n];
    const el=document.createElement('div');el.className='lensword';el.textContent=wd.d;
    el.style.color='rgba('+state.color+','+Math.min(1,state.lOp)+')';
    el.style.setProperty('--lop',state.lOp);
    el.style.mixBlendMode=state.lBlend;
    el.style.fontSize=(LC.r*0.15*state.lSize)+'px';
    el.style.left='0';el.style.top='0';zone.appendChild(el);
    const w=el.offsetWidth,h=el.offsetHeight,maxX=Math.max(0,LC.r*0.8-w/2),maxY=Math.max(0,LC.r*0.8-h/2);
    const ang=Math.random()*Math.PI*2,rad=Math.sqrt(Math.random());
    el.style.left=(LC.r+Math.cos(ang)*rad*maxX-w/2)+'px';el.style.top=(LC.r+Math.sin(ang)*rad*maxY-h/2)+'px';
    const dur=3.4;
    el.style.animation=state.lMove==='tremble'?('lw-tremble '+dur+'s ease-in-out forwards, lw-shake .12s linear infinite'):('lw-'+state.lMove+' '+dur+'s ease-in-out forwards');
    setTimeout(()=>el.remove(),dur*1000+100);
    if(book.folder && wd.f) playVoice(book.folder, wd.f);
}
let lensTimer=null;
function scheduleLens(){ const base=state.interval*1000, j=base*0.35*(Math.random()-0.5); lensTimer=setTimeout(()=>{spawnLens();scheduleLens();}, base+j); }

/* ===== 外（流れる文字） ===== */
const fallLayer=document.getElementById('fallLayer');
let fallTimer=null;
function spawnFall(){
    if(state.flow==='none')return;
    const words=curBook().words; if(!words.length)return;
    const d=document.createElement('div');d.className='drip';
    d.textContent=words[Math.floor(Math.random()*words.length)].d;
    d.style.fontSize=(1.05*state.fSize)+'rem';
    const bl=state.fBlur*(0.4+Math.random()*0.6); if(bl>0.05)d.style.filter='blur('+bl.toFixed(1)+'px)';
    d.style.color='rgba('+state.color+','+state.fOp+')';
    if(state.flow==='rain'){ d.classList.add('rainw'); d.style.left=(Math.random()*92+4)+'vw'; d.style.animationDuration=((6+Math.random()*8)/state.fSpeed)+'s'; }
    else { d.classList.add('starw'); d.style.left=(Math.random()*88+5)+'vw'; d.style.top=(Math.random()*82+5)+'vh'; d.style.setProperty('--op',(state.fOp*(0.55+Math.random()*0.55)).toFixed(2)); d.style.animationDuration=((2.6+Math.random()*2.4)/state.fSpeed)+'s'; d.style.animationIterationCount=2+Math.floor(Math.random()*3); }
    d.addEventListener('animationend',()=>d.remove());
    fallLayer.appendChild(d);setTimeout(()=>{try{d.remove();}catch(e){}},32000);
}
function startFall(){ clearInterval(fallTimer); if(state.flow==='none'){ fallLayer.innerHTML=''; return; } fallTimer=setInterval(spawnFall, Math.round(650/state.fDensity)); }

/* ===== スリープ防止（必須） ===== */
let wakeLock=null;
async function reqWake(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ ensureRun(); reqWake(); } });
window.addEventListener('touchstart',()=>ensureRun(),{passive:true});

/* ===== UI構築 ===== */
function buildUI(){
    const csw=document.getElementById('colorSw');
    COLORS.forEach(c=>{ const s=document.createElement('div'); s.className='sw'+(c.v===state.color?' on':''); s.style.background='rgb('+c.v+')'; s.title=c.n; s.addEventListener('click',()=>{ document.querySelectorAll('#colorSw .sw').forEach(x=>x.classList.remove('on')); s.classList.add('on'); state.color=c.v; scheduleSave(); }); csw.appendChild(s); });
    const sel=document.getElementById('bookSel');
    Object.keys(WORDBOOKS).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=k+'（'+WORDBOOKS[k].words.length+'）'+(WORDBOOKS[k].folder?' ♪':''); sel.appendChild(o); });
    sel.value=state.book;
    sel.addEventListener('change',()=>{ state.book=sel.value; li=-1; scheduleSave(); });

    setupChips('bgChips','bg',()=>{ applyBg(); layoutLens(); });
    setupChips('flowChips','flow',()=>{ startFall(); if(AC){ if(state.flow==='none'){stopAmbient();} else {startAmbient();} } });
    setupChips('moveChips','lMove',()=>{});
    setupChips('blendChips','lBlend',()=>{});

    S('fSpeed',x=>x.toFixed(1),()=>{}); S('fDensity',x=>x.toFixed(0),startFall); S('fSize',x=>x.toFixed(1),()=>{}); S('fOp',x=>x.toFixed(2).replace('0.','.'),()=>{}); S('fBlur',x=>x.toFixed(1),()=>{});
    S('interval',x=>x.toFixed(1)+'s',()=>{ clearTimeout(lensTimer); scheduleLens(); });
    S('voiceVol',x=>x.toFixed(2).replace('0.','.'),()=>{ if(voiceGain)voiceGain.gain.value=state.voiceVol; });
    S('ambientVol',x=>x.toFixed(2).replace('0.','.'),()=>{ if(ambientGain)ambientGain.gain.value=state.ambientVol; });
    S('lSize',x=>x.toFixed(1),()=>{}); S('lOp',x=>x.toFixed(2).replace('0.','.'),()=>{});

    document.querySelectorAll('.sec-h').forEach(h=>h.addEventListener('click',()=>h.parentElement.classList.toggle('open')));
    document.getElementById('bgFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ customBgData=rd.result; state.bg='custom'; state.customZone={cx:50,cy:50,r:26}; document.querySelectorAll('#bgChips .chip').forEach(x=>x.classList.remove('on')); applyBg(); setTimeout(layoutLens,60); }; rd.readAsDataURL(f); });
    reflectAll();
}
function setupChips(id,key,after){ document.querySelectorAll('#'+id+' .chip').forEach(b=>b.addEventListener('click',()=>{ document.querySelectorAll('#'+id+' .chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); state[key]=b.dataset.v; if(after)after(); scheduleSave(); })); }
function S(id,fmt,after){ const el=document.getElementById(id),v=document.getElementById(id+'V'); el.addEventListener('input',()=>{ state[id]=parseFloat(el.value); v.textContent=fmt(state[id]); if(after)after(); scheduleSave(); }); }
function reflectAll(){
    document.querySelectorAll('[data-chipgroup]').forEach(g=>{ const key=g.dataset.chipgroup; g.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.v===String(state[key]))); });
    ['fSpeed','fDensity','fSize','fOp','fBlur','interval','voiceVol','ambientVol','lSize','lOp'].forEach(id=>{ const el=document.getElementById(id),v=document.getElementById(id+'V'); if(el){ el.value=state[id]; if(v)v.textContent=el.value; } });
    document.querySelectorAll('#colorSw .sw').forEach((s,i)=>s.classList.toggle('on', COLORS[i].v===state.color));
}

/* ===== 開始 ===== */
function start(){
    initAudio(); ensureRun(); reqWake();
    applyBg(); setTimeout(layoutLens,50);
    startFall(); spawnLens(); scheduleLens();
    if(state.flow!=='none') startAmbient();
}
const panel=document.getElementById('panel');
document.getElementById('dot').addEventListener('click',()=>panel.classList.add('open'));
document.getElementById('closeP').addEventListener('click',()=>panel.classList.remove('open'));
let idleT=null; function activity(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add('idle'),4000); }
['mousemove','touchstart','click'].forEach(e=>window.addEventListener(e,activity,{passive:true}));

loadState(); buildUI(); activity();
const curtain=document.getElementById('curtain');
document.getElementById('goBtn').addEventListener('click',(e)=>{ e.stopPropagation(); curtain.style.opacity='0'; setTimeout(()=>curtain.remove(),1000); start(); });
</script>
