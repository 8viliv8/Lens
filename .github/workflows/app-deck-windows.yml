name: APP DECK Windows VST3
on:
  push:
    branches: [app-deck-v01-build]
    paths: ['app-deck/**', '.github/workflows/app-deck-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        id: configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app-deck/diagnostics | Out-Null
          cmd /c "cmake -S app-deck -B app-deck/build -G Ninja -DCMAKE_BUILD_TYPE=Release > app-deck/diagnostics/configure.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content app-deck/diagnostics/configure.log -Tail 120
          if ($code -ne 0) { exit $code }
      - name: Build
        id: compile
        if: steps.configure.outcome == 'success'
        shell: pwsh
        run: |
          cmd /c "cmake --build app-deck/build --config Release --target AppDeck_VST3 AppDeck_Standalone --parallel 2 > app-deck/diagnostics/build.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content app-deck/diagnostics/build.log -Tail 160
          if ($code -ne 0) { exit $code }
      - name: Publish diagnostic logs to branch
        if: always()
        shell: pwsh
        run: |
          $folder = "app-deck/diagnostics"
          New-Item -ItemType Directory -Force $folder | Out-Null
          $summary = @(
            "# APP DECK build diagnostics"
            ""
            "Workflow run: $env:GITHUB_RUN_ID"
            "Source commit: $env:GITHUB_SHA"
            "Configure outcome: ${{ steps.configure.outcome }}"
            "Build outcome: ${{ steps.compile.outcome }}"
            "Run URL: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          )
          $summary | Set-Content "$folder/STATUS.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$folder/STATUS.md"
          if (Test-Path "$folder/configure.log") { git add -f "$folder/configure.log" }
          if (Test-Path "$folder/build.log") { git add -f "$folder/build.log" }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "CI: publish APP DECK build diagnostics [skip ci]"
            git push origin HEAD:app-deck-v01-build
          }
      - name: Upload Windows VST3 and standalone
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: APP-DECK-Windows
          path: |
            app-deck/build/AppDeck_artefacts/Release/VST3/**
            app-deck/build/AppDeck_artefacts/Release/Standalone/**
          if-no-files-found: error
