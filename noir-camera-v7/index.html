<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><title>NOIR CAMERA v7</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:1fr auto}.stage{position:relative;overflow:hidden;background:#000}.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;background:#000}.stage video{object-fit:cover;transform-origin:center}.stage canvas{display:none}.status{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));left:10px;background:#0009;border:1px solid #ffffff25;border-radius:20px;padding:6px 9px;font-size:10px}.controls{background:#090909;padding:9px 10px max(10px,env(safe-area-inset-bottom))}.row{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.chip,.btn{border:1px solid #333;background:#111;color:#ddd;border-radius:20px;padding:8px 12px}.chip.active{background:#eee;color:#000}.knobs{display:grid;display:flex;gap:7px;min-height:92px;overflow-x:auto;padding:2px 1px 5px;scroll-snap-type:x proximity}.unit{text-align:center;flex:0 0 62px;scroll-snap-align:start}.unit small{display:block;color:#999;font-size:7px;margin-bottom:5px}.knob{width:58px;height:58px;max-width:100%;border-radius:50%;border:1px solid #444;background:#111;color:#fff;touch-action:none}.knob.on{transform:scale(1.12);border-color:#fff}.shoot{display:grid;grid-template-columns:1fr 1fr 68px;gap:8px;align-items:center;margin-top:8px}.btn{height:42px;border-radius:12px}.shutter{width:62px;height:62px;border-radius:50%;border:7px solid #171717;background:#eee}.file{display:none}</style></head><body><div class="app"><div class="stage" id="stage"><video id="v" playsinline muted autoplay></video><canvas id="c"></canvas><div class="status" id="status">READY</div></div><div class="controls"><div class="row"><button class="chip lens active" data-lens="1">1×</button><button class="chip lens" data-lens="2">2×</button><button class="chip lens" data-lens="3">3×</button><button class="chip active" data-mode="color">COLOR</button><button class="chip" data-mode="bw">B&W</button></div><div class="knobs" id="knobs"></div><div class="shoot"><button class="btn" id="live">LIVE</button><button class="btn" id="photo">PHOTO</button><button class="shutter" id="shot"></button></div><input id="file" class="file" type="file" accept="image/*"></div></div><script src="camera.js?v=1"></script><script src="grain.js?v=2"></script><script src="tone-fx.js?v=1"></script><script src="editor.js?v=4"></script><script src="ui.js?v=4"></script></body></html>
