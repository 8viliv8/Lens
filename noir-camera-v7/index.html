<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><title>NOIR CAMERA v7</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,sans-serif}.app{height:100dvh;display:grid;grid-template-rows:1fr auto}.stage{position:relative;overflow:hidden;background:#000}.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;background:#000}.stage video{object-fit:cover;transform-origin:center}.stage canvas{display:none}.status{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));left:10px;background:#0009;border:1px solid #ffffff25;border-radius:20px;padding:6px 9px;font-size:10px}.controls{position:relative;z-index:10;background:#090909;padding:8px 10px max(8px,env(safe-area-inset-bottom));max-height:46dvh;overflow:hidden}.row{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.chip,.btn{border:1px solid #333;background:#111;color:#ddd;border-radius:20px;padding:8px 12px}.chip.active{background:#eee;color:#000}.knobs{display:flex;gap:10px;height:108px;overflow-x:scroll;overflow-y:hidden;padding:8px 10px 14px;margin:0 -10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none}.knobs::-webkit-scrollbar{display:none}.unit{text-align:center;flex:0 0 70px;scroll-snap-align:start;padding:0 2px}.unit small{display:block;color:#aaa;font-size:8px;margin-bottom:5px;white-space:nowrap}.knob{width:66px;height:66px;max-width:100%;border-radius:50%;border:1px solid #555;background:#111;color:#fff;touch-action:none;position:relative;font-size:11px}.knob:before{content:"";position:absolute;inset:-7px;border-radius:50%}.knob.on{transform:scale(1.06);border-color:#fff;background:#181818}.scrollrail{height:8px;margin:1px 2px 6px;background:#252525;border:1px solid #3b3b3b;border-radius:999px;position:relative;overflow:hidden;touch-action:none}.scrollthumb{height:100%;width:32%;background:#aaa;border-radius:999px;position:absolute;left:0;top:0;transform:translateX(0)}.tools{display:flex;gap:6px;overflow-x:auto;margin:2px 0 7px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tools .btn{flex:0 0 auto;height:34px;padding:6px 10px;font-size:10px}.tools .active{background:#eee;color:#000}.shoot{display:grid;grid-template-columns:1fr 1fr 68px;gap:8px;align-items:center;margin-top:4px;position:relative;z-index:20}.btn{height:42px;border-radius:12px}.shutter{width:62px;height:62px;border-radius:50%;border:7px solid #171717;background:#eee}.file{display:none}</style></head><body><div class="app"><div class="stage" id="stage"><video id="v" playsinline muted autoplay></video><canvas id="c"></canvas><div class="status" id="status">READY</div></div><div class="controls"><div class="row"><button class="chip lens active" data-lens="1">1×</button><button class="chip lens" data-lens="2">2×</button><button class="chip lens" data-lens="3">3×</button><button class="chip active" data-mode="color">COLOR</button><button class="chip" data-mode="bw">B&W</button></div><div class="knobs" id="knobs"></div><div class="scrollrail" id="scrollrail"><div class="scrollthumb" id="scrollthumb"></div></div><div class="tools"><button class="btn active" data-crop="free">FREE</button><button class="btn" data-crop="1:1">1:1</button><button class="btn" data-crop="4:3">4:3</button><button class="btn" data-crop="3:2">3:2</button><button class="btn" data-crop="16:9">16:9</button><button class="btn" data-crop="9:16">9:16</button><button class="btn" id="second">2ND IMAGE</button><button class="btn" id="cutup">CUT-UP</button><button class="btn" id="cutoff">CUT OFF</button><button class="btn" id="exportJpg">JPEG</button><button class="btn" id="exportPng">PNG</button></div><div class="shoot"><button class="btn" id="live">LIVE</button><button class="btn" id="photo">読み込み</button><button class="shutter" id="shot"></button></div><input id="file" class="file" type="file" accept="image/*"><input id="file2" class="file" type="file" accept="image/*"></div></div><script src="camera.js?v=1"></script><script src="grain.js?v=10"></script><script src="tone-fx.js?v=1"></script><script src="frame-fx.js?v=1"></script><script src="crop-fx.js?v=1"></script><script src="export-fx.js?v=1"></script><script src="cut-fx.js?v=18"></script><script src="editor.js?v=18"></script><script src="ui.js?v=18"></script></body></html>
